[alembic]
script_location = alembic
prepend_sys_path = .

# file_template controls the name of generated migration files.
file_template = %%(rev)s_%%(slug)s

# Timezone for --autogenerate timestamps.
timezone = UTC

# sqlalchemy.url is intentionally empty here — env.py reads it from
# Settings (DATABASE_URL env var) so the same ini works for all envs.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
