# Cloud Build pipeline — RouterV
#
# Triggered on push to main branch
# Assumes the following substitutions are set in the trigger:
#   _REGION           GCP region, e.g. "us-central1"
#   _REPO             Artifact Registry repo, e.g. "routersvc"
#   _SERVICE          Cloud Run service name, e.g. "routersvc"
#   _SERVICE_URL      Cloud Run service URL for the scheduler job
#   _ADMIN_SECRET     Value of ADMIN_SECRET env var (for scheduler auth)
#
# Steps
# -----
# 1. Build the Docker image (multi-stage, non-root)
# 2. Push to Artifact Registry
# 3. Run Alembic migrations as a one-off Cloud Run job
# 4. Deploy new Cloud Run revision
# 5. Shift traffic to new revision
# 6. Ensure Cloud Scheduler job exists for daily model price re-seed

substitutions:
  _REGION: asia-southeast1
  _REPO: routersvc
  _SERVICE: routersvc
  _DB_CONNECTION: "fair-myth-471110-j2:asia-south1:api-prod-pg"
  _SERVICE_ACCOUNT: "api-routersvc-sa@fair-myth-471110-j2.iam.gserviceaccount.com"
  _DATABASE_URL: ""    # set in trigger: full asyncpg DATABASE_URL
  _SERVICE_URL: ""     # set in trigger: Cloud Run service URL, e.g. https://routersvc-xxx.a.run.app
  _ADMIN_SECRET: ""    # set in trigger: value of ADMIN_SECRET env var

steps:
  # ── 1. Build ───────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build
    args:
      - build
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
      - --tag
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - --cache-from
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"
      - .

  # ── 2. Push ────────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}"
    waitFor: [build]

  # ── 3. Migrate ─────────────────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: migrate-update
    entrypoint: bash
    args:
      - -c
      - |
        REGION=${_REGION}
        [ -z "$$REGION" ] && REGION=asia-southeast1
        gcloud run jobs delete ${_SERVICE}-migrate --region="$$REGION" --quiet 2>/dev/null || true
        gcloud run jobs create ${_SERVICE}-migrate \
          --image="$$REGION-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}" \
          --command=alembic \
          --args="upgrade,head" \
          --set-cloudsql-instances="${_DB_CONNECTION}" \
          --set-env-vars="DATABASE_URL=${_DATABASE_URL}" \
          --service-account="${_SERVICE_ACCOUNT}" \
          --region="$$REGION" \
          --max-retries=0
    waitFor: [push]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: migrate
    entrypoint: bash
    args:
      - -c
      - |
        REGION=${_REGION}
        [ -z "$$REGION" ] && REGION=asia-southeast1
        gcloud run jobs execute ${_SERVICE}-migrate --region="$$REGION" --wait
    waitFor: [migrate-update]

  # ── 4. Deploy ──────────────────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: deploy
    entrypoint: bash
    args:
      - -c
      - |
        REGION=${_REGION}
        [ -z "$$REGION" ] && REGION=asia-southeast1
        gcloud run deploy ${_SERVICE} \
          --image="$$REGION-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}" \
          --region="$$REGION" \
          --platform=managed \
          --no-traffic
    waitFor: [migrate]

  # ── 5. Shift traffic after deploy succeeds ─────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: shift-traffic
    entrypoint: bash
    args:
      - -c
      - |
        REGION=${_REGION}
        [ -z "$$REGION" ] && REGION=asia-southeast1
        gcloud run services update-traffic ${_SERVICE} --region="$$REGION" --to-latest
    waitFor: [deploy]

  # ── 6. Ensure Cloud Scheduler job for daily model price re-seed ────────────
  # Creates the job on first run; updates it on subsequent runs (idempotent).
  # Runs at 02:00 UTC daily — seeds model_prices from OpenRouter /api/v1/models.
  # Requires _SERVICE_URL and _ADMIN_SECRET to be set in the trigger substitutions.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: ensure-scheduler-seed
    entrypoint: bash
    args:
      - -c
      - |
        if [ -z "${_SERVICE_URL}" ] || [ -z "${_ADMIN_SECRET}" ]; then
          echo "Skipping scheduler setup: _SERVICE_URL or _ADMIN_SECRET not set."
          exit 0
        fi
        REGION=${_REGION}
        [ -z "$$REGION" ] && REGION=asia-southeast1
        JOB_NAME="${_SERVICE}-seed-model-prices"
        SCHEDULE="0 2 * * *"
        URI="${_SERVICE_URL}/admin/model-prices/seed"
        gcloud scheduler jobs create http "$$JOB_NAME" \
          --location="$$REGION" \
          --schedule="$$SCHEDULE" \
          --uri="$$URI" \
          --message-body="{}" \
          --http-method=POST \
          --headers="Authorization=Bearer ${_ADMIN_SECRET},Content-Type=application/json" \
          --attempt-deadline=5m \
          --time-zone="UTC" \
          2>/dev/null \
        || \
        gcloud scheduler jobs update http "$$JOB_NAME" \
          --location="$$REGION" \
          --schedule="$$SCHEDULE" \
          --uri="$$URI" \
          --message-body="{}" \
          --http-method=POST \
          --headers="Authorization=Bearer ${_ADMIN_SECRET},Content-Type=application/json" \
          --attempt-deadline=5m \
          --time-zone="UTC"
    waitFor: [shift-traffic]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:${SHORT_SHA}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/${_SERVICE}:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_MEDIUM
