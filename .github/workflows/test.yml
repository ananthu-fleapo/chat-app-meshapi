name: run-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
        env:
          OPENROUTER_API_KEY: test-key
          ENV: dev
          DATABASE_URL: ""
          REDIS_URL: redis://localhost:6379/0
          WEBHOOK_API_KEY: test-webhook-secret
          SUPABASE_JWT_SECRET: test-supabase-jwt-secret-for-testing-only
          HEALTH_CHECK_API_KEY: rsk_01KPQNHJSKASDFfGT9A668DNDU468W
          HEALTH_CHECK_SELF_URL: http://localhost:8000
          MONGODB_URL: mongodb://user:pass@meshapi.ai/routersvc

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":x: *${{ github.workflow }}* failed on `${{ github.ref_name }}`",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Repository", "value": "${{ github.repository }}", "short": true },
                    { "title": "Triggered by", "value": "${{ github.actor }}", "short": true },
                    { "title": "Event", "value": "${{ github.event_name }}", "short": true },
                    { "title": "PR", "value": "${{ github.event.pull_request.html_url || 'N/A' }}", "short": true },
                    { "title": "Commit", "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>", "short": true },
                    { "title": "Run", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>", "short": true }
                  ]
                }
              ]
            }
