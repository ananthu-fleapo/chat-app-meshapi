[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "routersvc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.2.0",
    "python-ulid>=2.7.0",
    # Phase 2 — DB + auth
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Phase 3 — cache + rate limiting
    "redis[asyncio]>=5.0.0",
    # Control plane JWT verification (Supabase HS256 tokens)
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx",
]

# Install in GCP/production environments for Secret Manager integration.
# Not required locally — the resolver falls back to settings.openrouter_api_key
# when this package is absent.
gcp = [
    "google-cloud-secret-manager>=2.20.0",
]

# Full production set (combine with: pip install -e ".[gcp,observability]")
# Phase 7 deps:
# observability = [
#     "prometheus-fastapi-instrumentator>=7.0.0",
#     "opentelemetry-sdk>=1.25.0",
# ]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
